<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>충성관 1층 좌석 배치</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Malgun Gothic','맑은 고딕',sans-serif; background:#eceff3; color:#1a1a2e; padding:16px; }
h1 { text-align:center; font-size:20px; margin-bottom:4px; letter-spacing:1px; }
.sub { text-align:center; font-size:13px; color:#777; margin-bottom:12px; }

/* ---- Toolbar ---- */
.toolbar {
  position: sticky; top:0; z-index:50;
  background:white; border-radius:10px; padding:12px 14px;
  box-shadow:0 2px 10px rgba(0,0,0,.10); margin-bottom:14px;
}
.tool-row { display:flex; flex-wrap:wrap; gap:7px; justify-content:center; align-items:center; }
.tool-row + .tool-row { margin-top:9px; }
.hint { width:100%; text-align:center; font-size:12px; color:#999; }

.btn {
  padding:7px 15px; border:2.5px solid transparent; border-radius:7px;
  cursor:pointer; font-size:13px; font-weight:bold; color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,.25); transition:transform .12s, box-shadow .12s;
  min-width:68px;
}
.btn:hover { transform:translateY(-1px); }
.btn.active { border-color:#1a1a2e; box-shadow:0 0 0 3px rgba(0,0,0,.18); transform:scale(1.05); }
.btn.light { color:#2a2a2a; text-shadow:none; }
.btn.tool { background:#f3f4f6; color:#444; border-color:#d5d8dd; min-width:auto; }
.btn.tool.active { border-color:#1a1a2e; background:#fffbe6; }
.btn.reset { background:#dc3545; }
.btn.reset:hover { background:#c82333; }
.divider { width:1px; height:30px; background:#e2e5ea; margin:0 4px; }
.counter { font-size:13px; color:#555; font-weight:bold; }

/* ---- Stage / Canvas ---- */
.scroll { overflow:auto; background:white; border-radius:10px; box-shadow:0 2px 10px rgba(0,0,0,.10); padding:10px; }
.canvas { position:relative; width:1480px; height:880px; margin:0 auto; }

.stage {
  position:absolute; left:540px; top:0; width:400px; height:64px;
  background:linear-gradient(180deg,#c9a978,#a3824f);
  border-radius:6px; display:flex; align-items:center; justify-content:center;
  color:#fff; font-size:22px; font-weight:bold; letter-spacing:6px;
  box-shadow:0 4px 8px rgba(0,0,0,.18);
}

.block { position:absolute; }
.block .label {
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  font-size:13px; font-weight:bold; color:#333; pointer-events:none;
  background:rgba(255,255,255,.55); padding:0 3px; border-radius:3px; white-space:nowrap;
}
.seat-row { display:flex; gap:3px; margin-bottom:3px; justify-content:center; }
.seat {
  width:14px; height:14px; border:1.4px solid #777; border-radius:3px;
  background:#fff; cursor:pointer; transition:background .08s, transform .05s;
}
.seat:hover { transform:scale(1.25); border-color:#1a1a2e; z-index:5; }
</style>
</head>
<body>
  <h1>충성관 1층 좌석 배치도</h1>
  <div class="sub">중대를 선택한 뒤 좌석을 클릭하거나 드래그해서 색칠하세요 · <span id="total"></span></div>

  <div class="toolbar">
    <div class="tool-row" id="companyRow"></div>
    <div class="tool-row">
      <button class="btn tool" data-mode="paint" id="modePaint">🖌 칠하기</button>
      <button class="btn tool" data-mode="erase" id="modeErase">🧽 지우개</button>
      <div class="divider"></div>
      <span class="counter" id="counter"></span>
      <div class="divider"></div>
      <button class="btn reset" id="resetBtn">전체 초기화</button>
    </div>
    <div class="tool-row"><span class="hint">한 칸 클릭 = 1좌석 · 누른 채 드래그 = 여러 좌석 한번에</span></div>
  </div>

  <div class="scroll">
    <div class="canvas" id="canvas">
      <div class="stage">무대</div>
    </div>
  </div>

<script>
/* =========================================================
   좌석 데이터 — 각 구역: rows = [행별 좌석수]
   행/열을 바꾸려면 이 숫자만 고치면 됩니다.
   ========================================================= */
const SECTIONS = [
  // 좌측 날개 (기울임)
  {id:'L40', label:'40석', rows:[8,8,8,8,8],            x:210, y:120, rot:-30},
  {id:'L46', label:'46석', rows:[9,9,9,9,10],           x:70,  y:215, rot:-30},
  {id:'L79', label:'79석', rows:[11,11,11,11,11,12,12], x:10,  y:340, rot:-30},

  // 중앙 상단 (여단/대대본부 포함)
  {id:'CTL', label:'42석', rows:[9,10,11,12],           x:395, y:150, rot:0},
  {id:'CTM', label:'48석', rows:[11,12,12,13],          x:615, y:150, rot:0},
  {id:'CTR', label:'42석', rows:[12,11,10,9],           x:850, y:150, rot:0},

  // VIP
  {id:'VIP', label:'VIP 8석', rows:[8],                 x:625, y:325, rot:0},

  // 중앙 본체
  {id:'M66L', label:'66석', rows:[7,8,8,8,9,9,9,8],         x:300, y:385, rot:0},
  {id:'M80L', label:'80석', rows:[10,10,10,10,10,10,10,10], x:470, y:385, rot:0},
  {id:'M96',  label:'96석', rows:[12,12,12,12,12,12,12,12], x:660, y:385, rot:0},
  {id:'M80R', label:'80석', rows:[10,10,10,10,10,10,10,10], x:895, y:385, rot:0},
  {id:'M66R', label:'66석', rows:[8,9,9,9,8,8,8,7],         x:1085,y:385, rot:0},

  // 우측 날개 (기울임)
  {id:'R30', label:'30석', rows:[6,6,6,6,6],            x:1130, y:120, rot:30},
  {id:'R46', label:'46석', rows:[10,9,9,9,9],           x:1185, y:215, rot:30},
  {id:'R79', label:'79석', rows:[12,12,11,11,11,11,11], x:1180, y:340, rot:30},
];

/* 중대별 고정 색상 */
const COMPANIES = [
  {name:'1중대',   color:'#FF8C42'},
  {name:'2중대',   color:'#FF69B4'},
  {name:'3중대',   color:'#8BBF3A'},
  {name:'4중대',   color:'#9370DB'},
  {name:'5중대',   color:'#FF5C5C'},
  {name:'6중대',   color:'#3B7DD8'},
  {name:'7중대',   color:'#6AB8E8', light:true},
  {name:'8중대',   color:'#30C9B8', light:true},
  {name:'여단본부', color:'#85D485', light:true},
  {name:'대대본부', color:'#9AA0A6'},
];

const STORAGE_KEY = 'seatmap_v3';
let state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); // seatId -> color
let current = COMPANIES[0];
let mode = 'paint';       // 'paint' | 'erase'
let painting = false;

/* ---- 좌석 렌더링 ---- */
const canvas = document.getElementById('canvas');
let totalSeats = 0;

SECTIONS.forEach(sec => {
  const block = document.createElement('div');
  block.className = 'block';
  block.style.left = sec.x + 'px';
  block.style.top  = sec.y + 'px';
  if (sec.rot) block.style.transform = `rotate(${sec.rot}deg)`;

  sec.rows.forEach((count, r) => {
    const row = document.createElement('div');
    row.className = 'seat-row';
    for (let c = 0; c < count; c++) {
      const seat = document.createElement('div');
      seat.className = 'seat';
      const id = `${sec.id}-${r}-${c}`;
      seat.dataset.id = id;
      if (state[id]) seat.style.background = state[id];
      row.appendChild(seat);
      totalSeats++;
    }
    block.appendChild(row);
  });

  const lab = document.createElement('div');
  lab.className = 'label';
  lab.textContent = sec.label;
  block.appendChild(lab);

  canvas.appendChild(block);
});

document.getElementById('total').textContent = `총 ${totalSeats}석`;

/* ---- 중대 버튼 ---- */
const companyRow = document.getElementById('companyRow');
COMPANIES.forEach((co, i) => {
  const b = document.createElement('button');
  b.className = 'btn' + (co.light ? ' light' : '');
  b.style.background = co.color;
  b.textContent = co.name;
  b.addEventListener('click', () => {
    current = co; mode = 'paint';
    document.querySelectorAll('#companyRow .btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    syncModeButtons();
  });
  if (i === 0) b.classList.add('active');
  companyRow.appendChild(b);
});

/* ---- 모드 버튼 ---- */
const modePaint = document.getElementById('modePaint');
const modeErase = document.getElementById('modeErase');
function syncModeButtons() {
  modePaint.classList.toggle('active', mode === 'paint');
  modeErase.classList.toggle('active', mode === 'erase');
}
modePaint.addEventListener('click', () => { mode = 'paint'; syncModeButtons(); });
modeErase.addEventListener('click', () => { mode = 'erase'; syncModeButtons(); });
syncModeButtons();

/* ---- 칠하기 / 지우기 ---- */
function applySeat(seat) {
  const id = seat.dataset.id;
  if (mode === 'erase') {
    delete state[id];
    seat.style.background = '#fff';
  } else {
    state[id] = current.color;
    seat.style.background = current.color;
  }
}
function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); updateCounter(); }

canvas.addEventListener('mousedown', e => {
  if (!e.target.classList.contains('seat')) return;
  e.preventDefault();
  painting = true;
  applySeat(e.target);
});
canvas.addEventListener('mouseover', e => {
  if (painting && e.target.classList.contains('seat')) applySeat(e.target);
});
document.addEventListener('mouseup', () => { if (painting) { painting = false; save(); } });

/* 모바일 터치 드래그 */
canvas.addEventListener('touchstart', e => {
  const t = document.elementFromPoint(e.touches[0].clientX, e.touches[0].clientY);
  if (t && t.classList.contains('seat')) { painting = true; applySeat(t); e.preventDefault(); }
}, {passive:false});
canvas.addEventListener('touchmove', e => {
  if (!painting) return;
  const t = document.elementFromPoint(e.touches[0].clientX, e.touches[0].clientY);
  if (t && t.classList.contains('seat')) applySeat(t);
  e.preventDefault();
}, {passive:false});
document.addEventListener('touchend', () => { if (painting) { painting = false; save(); } });

/* ---- 초기화 ---- */
document.getElementById('resetBtn').addEventListener('click', () => {
  if (!confirm('전체 좌석 색상을 초기화할까요?')) return;
  state = {};
  localStorage.removeItem(STORAGE_KEY);
  document.querySelectorAll('.seat').forEach(s => s.style.background = '#fff');
  updateCounter();
});

/* ---- 카운터 ---- */
function updateCounter() {
  const n = Object.keys(state).length;
  document.getElementById('counter').textContent = `배정 ${n} / ${totalSeats}석`;
}
updateCounter();
</script>
</body>
</html>
