.sub { text-align:center; font-size:12px; color:#888; margin-bottom:10px; }

.hint { width:100%; text-align:center; font-size:12px; color:#999; }
.btn { padding:6px 14px; border:2.5px solid transparent; border-radius:7px; cursor:pointer;

.btn.reset { background:#dc3545; } .btn.reset:hover { background:#c82333; }
.divider { width:1px; height:28px; background:#e2e5ea; margin:0 4px; }
.counter { font-size:13px; color:#555; font-weight:bold; }

.scroll { overflow:auto; background:#fff; border-radius:10px; box-shadow:0 2px 10px rgba(0,0,0,.10); padding:8px; }
.stage { position:relative; width:1000px; max-width:100%; margin:0 auto; user-select:none; }
.stage img { width:100%; display:block; -webkit-user-drag:none; pointer-events:none; }
.seat { position:absolute; transform:translate(-50%,-50%); border-radius:3px;
  cursor:pointer; background:transparent; transition:background .06s; }
.seat:hover { outline:2px solid #1a1a2e; }
.seat.on { mix-blend-mode:multiply; }

document.getElementById('total').textContent = SEATS.length;

const COMPANIES = [
  {name:'1중대',color:'#FF8C42'},{name:'2중대',color:'#FF69B4'},
  {name:'3중대',color:'#8BBF3A'},{name:'4중대',color:'#9370DB'},
  {name:'5중대',color:'#FF5C5C'},{name:'6중대',color:'#3B7DD8'},
  {name:'7중대',color:'#6AB8E8',light:true},{name:'8중대',color:'#30C9B8',light:true},
  {name:'여단본부',color:'#85D485',light:true},{name:'대대본부',color:'#9AA0A6'},
];

const KEY='seatmap_overlay_v1';
let state = JSON.parse(localStorage.getItem(KEY)||'{}');
let current = COMPANIES[0];
let mode='paint', painting=false;

const stage=document.getElementById('stage');
SEATS.forEach((s,i)=>{
  const el=document.createElement('div');
  el.className='seat'; el.dataset.id=i;
  el.style.left=s.x+'%'; el.style.top=s.y+'%';
  el.style.width=SW+'%'; el.style.height=SH+'%';
  if(state[i]){ el.style.background=state[i]; el.classList.add('on'); }
  stage.appendChild(el);
});

const companyRow=document.getElementById('companyRow');
COMPANIES.forEach((co,i)=>{
  const b=document.createElement('button');
  b.className='btn'+(co.light?' light':''); b.style.background=co.color; b.textContent=co.name;
  b.onclick=()=>{ current=co; mode='paint';
    document.querySelectorAll('#companyRow .btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); syncMode(); };
  if(i===0) b.classList.add('active');
  companyRow.appendChild(b);
});

const mP=document.getElementById('modePaint'), mE=document.getElementById('modeErase');
function syncMode(){ mP.classList.toggle('active',mode==='paint'); mE.classList.toggle('active',mode==='erase'); }
mP.onclick=()=>{mode='paint';syncMode();}; mE.onclick=()=>{mode='erase';syncMode();}; syncMode();

function apply(el){
  const id=el.dataset.id;
  if(mode==='erase'){ delete state[id]; el.style.background='transparent'; el.classList.remove('on'); }
  else { state[id]=current.color; el.style.background=current.color; el.classList.add('on'); }
}
function save(){ localStorage.setItem(KEY,JSON.stringify(state)); updateCounter(); }

stage.addEventListener('mousedown',e=>{ if(!e.target.classList.contains('seat'))return;
  e.preventDefault(); painting=true; apply(e.target); });
stage.addEventListener('mouseover',e=>{ if(painting&&e.target.classList.contains('seat')) apply(e.target); });
document.addEventListener('mouseup',()=>{ if(painting){painting=false;save();} });

stage.addEventListener('touchstart',e=>{ const t=document.elementFromPoint(e.touches[0].clientX,e.touches[0].clientY);
  if(t&&t.classList.contains('seat')){painting=true;apply(t);e.preventDefault();} },{passive:false});
stage.addEventListener('touchmove',e=>{ if(!painting)return;
  const t=document.elementFromPoint(e.touches[0].clientX,e.touches[0].clientY);
  if(t&&t.classList.contains('seat'))apply(t); e.preventDefault(); },{passive:false});
document.addEventListener('touchend',()=>{ if(painting){painting=false;save();} });

document.getElementById('resetBtn').onclick=()=>{
  if(!confirm('전체 좌석 색상을 초기화할까요?'))return;
  state={}; localStorage.removeItem(KEY);
  document.querySelectorAll('.seat').forEach(s=>{s.style.background='transparent';s.classList.remove('on');});
  updateCounter();
};

function updateCounter(){ document.getElementById('counter').textContent='배정 '+Object.keys(state).length+' / '+SEATS.length+'석'; }
updateCounter();
